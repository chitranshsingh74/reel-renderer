
name: Render Reel

on:
  workflow_dispatch:
    inputs:
      html_file:
        description: "HTML file to render"
        required: true
        default: "water-cycle.html"

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Validate HTML
        env:
          HTML_FILE: ${{ inputs.html_file }}
        run: |
          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: HTML file not found: $HTML_FILE"
            exit 1
          fi

      - name: Render animation
        env:
          HTML_FILE: ${{ inputs.html_file }}
        run: |
          mkdir -p frames

          cat > render.js <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            try {
              const page = await browser.newPage({
                viewport: { width: 1080, height: 1920 },
                deviceScaleFactor: 1
              });

              page.on('pageerror', error => {
                console.error('PAGE ERROR:', error.message);
              });

              const file = path.resolve(process.env.HTML_FILE);

              await page.goto(
                'file://' + file + '?record=1&manual=1',
                { waitUntil: 'load' }
              );

              await page.waitForTimeout(1000);

              const ready = await page.evaluate(() => {
                return Boolean(
                  document.querySelector('#stage') &&
                  window.renderFrame
                );
              });

              if (!ready) {
                throw new Error(
                  'Animation stage or window.renderFrame() missing'
                );
              }

              const duration = 10;
              const fps = 30;
              const totalFrames = duration * fps;

              for (let i = 0; i < totalFrames; i++) {
                await page.evaluate(t => {
                  window.renderFrame(t);
                }, i / fps);

                await page.screenshot({
                  path: `frames/frame${String(i).padStart(4, '0')}.png`
                });
              }

              console.log(`Rendered ${totalFrames} frames successfully.`);
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node render.js

      - name: Create MP4
        run: |
          ffmpeg -y \
            -framerate 30 \
            -i frames/frame%04d.png \
            -frames:v 300 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            reel.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: generated-reel
          path: reel.mp4
          if-no-files-found: error
