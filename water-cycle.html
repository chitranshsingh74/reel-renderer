<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
<title>The Water Cycle – 10s Animation</title>  
<!--  
RECORDING / FFMPEG  
 ?record=1          exact 1080x1920 stage, no UI, autoplays once (screen-record a 1080x1920 viewport)  
 ?record=1&manual=1 no autoplay; step frames: window.renderFrame(i/30) for i=0..300, screenshot each, then  
   ffmpeg -framerate 30 -i f%04d.png -c:v libx264 -pix_fmt yuv420p out.mp4  
 Everything is a pure function of time t (0-10 s), so frames are exact. window.DURATION = 10.  
-->  
<style>  
:root{--page:#e6f0f7;--ink:#12324d;--btn:#1565c0;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}  
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0b1722;--ink:#e6f1fa;--btn:#4aa3ff;--btnink:#06121d}}  
:root[data-theme="dark"]{--page:#0b1722;--ink:#e6f1fa;--btn:#4aa3ff;--btnink:#06121d}  
html,body{height:100%;margin:0}  
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}  
#wrap{position:relative;overflow:hidden;flex:none}  
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}  
svg{display:block}  
#bar{display:flex;gap:12px;align-items:center;height:68px;width:min(100%,520px);padding:0 14px;box-sizing:border-box;flex:none}  
#bar button{font:inherit;font-weight:700;background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:8px 18px;min-width:84px}  
#bar input{flex:1;min-width:0}  
#tl{font-variant-numeric:tabular-nums;font-size:14px;width:48px;text-align:right}  
.rec{background:#000;justify-content:flex-start;align-items:flex-start}
