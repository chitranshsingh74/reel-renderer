<!--
RECORDING / FFMPEG
 ?record=1          exact 1080x1920 stage, no UI, autoplays once (screen-record a 1080x1920 viewport)
 ?record=1&manual=1 no autoplay; step frames: window.renderFrame(i/30) for i=0..300, screenshot each, then
   ffmpeg -framerate 30 -i f%04d.png -c:v libx264 -pix_fmt yuv420p out.mp4
 Everything is a pure function of time t (0-10 s), so frames are exact. window.DURATION = 10.
-->
<style>

#bar button{font:inherit;font-weight:700;background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:8px 18px;min-width:84px}
#bar input{flex:1;min-width:0}
#tl{font-variant-numeric:tabular-nums;font-size:14px;width:48px;text-align:right}
.rec{background:#000;justify-content:flex-start;align-items:flex-start}
.rec #bar{display:none}
</style>

 ['pL','pR'].forEach(id=>{E(id).setAttribute('cx',Math.sin(t*2)*3);E(id).setAttribute('cy',o.ly)});

const stage=E('stage'),wrap=E('wrap'),btn=E('btn'),rng=E('rng');
let TT=0,playing=!MANUAL,last=0;
function fit(){const c=REC?0:68,s=REC?1:Math.min(innerWidth/1080,(innerHeight-c)/1920);stage.style.transform=`scale(${s})`;wrap.style.width=1080*s+'px';wrap.style.height=1920*s+'px'}
function loop(now){if(!last)last=now;if(playing){TT+=(now-last)/1000;if(TT>=D){TT=D;playing=false;btn.textContent='Replay';window.__done=true}render(TT)}last=now;requestAnimationFrame(loop)}
btn.onclick=()=>{if(TT>=D){TT=0;window.__done=false}playing=!playing;btn.textContent=playing?'Pause':'Play'};
rng.oninput=()=>{TT=+rng.value;playing=false;btn.textContent='Play';render(TT)};
if(REC)document.body.classList.add('rec');
window.DURATION=D;window.FPS=30;window.renderFrame=window.seek=t=>{TT=t;render(t)};
addEventListener('resize',fit);fit();
const q=Q.match(/[?&]t=([\d.]+)/);if(q){TT=+q[1];playing=false}
render(TT);if(MANUAL||q)btn.textContent='Play';
requestAnimationFrame(loop);
</script>
</body>
</html>
